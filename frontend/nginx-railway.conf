# Railway publica solo este servicio; la API permanece en la red privada.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # El backend limita cada archivo a 5 MiB; dejar espacio para multipart.
  client_max_body_size 26m;
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

  location /api/ {
    # Resolver en runtime permite que cambie la IP privada al redesplegar.
    set $backend ${BACKEND_UPSTREAM};
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    # Esta configuración se usa detrás del HTTPS de Railway.
    proxy_set_header X-Forwarded-Proto https;
    # Railway proporciona X-Real-IP en su entrada HTTP pública.
    proxy_set_header X-Forwarded-For $http_x_real_ip;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    # OAuth usa Path=/auth; el navegador accede por /api/auth.
    # Mantener intacta la cookie de sesión con Path=/.
    proxy_cookie_path /auth /api/auth;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
