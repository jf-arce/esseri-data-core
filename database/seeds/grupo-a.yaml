# Grupo A — confirmado por RF o por el cliente, se puede cargar sin validar más con ESSERI.
# Ver docs/diccionario-de-datos-esseri.md, sección "Tablas Catálogo — Datos a Precargar".
#
# Este archivo es solo datos: todavía NO hay un script que los cargue, porque los
# modelos SQLAlchemy de los módulos correspondientes (auth/models.py, workflows/models.py,
# facturacion/models.py, academico/models.py) son placeholders vacíos por ahora. Cuando
# existan, un script en esta carpeta (ej. 01_roles.py, 02_tipo_evento.py) debería leer
# este YAML e insertar las filas vía SessionLocal (src/database.py) — nunca con SQL
# escrito a mano.

rol: # RF-28 + aclaración cliente respuesta 18 — pasa de 4 a 10 valores
  - nombre: dirección
  - nombre: administración
  - nombre: docente
  - nombre: familia
  - nombre: secretaría
  - nombre: coordinación académica
  - nombre: bienestar/orientación
  - nombre: admisiones/comercial
  - nombre: compras
  - nombre: administrador del sistema

tipo_evento: # RF-24 (3 ejemplos originales) + eventos nuevos de las aclaraciones del cliente
  - nombre: inasistencia.registrada
    descripcion: Se registró una ausencia
  - nombre: inasistencia.justificada
    descripcion: Se resolvió una justificación de ausencia
  - nombre: factura.vencida
    descripcion: Una factura pasó a estado vencida
  - nombre: inscripcion.cambio_matricula
    descripcion: Cambio de nivel, división o baja
  - nombre: solicitud_inscripcion.aprobada
    descripcion: Una solicitud de admisión llegó a etapa aprobada
  - nombre: pago.registrado
    descripcion: Se confirmó un pago
  - nombre: pago.rechazado
    descripcion: Un pago fue rechazado (ej. stop debit)

metodo_pago: # aclaración cliente respuesta 4 — confirmado, pasa del Grupo B a este grupo
  - nombre: debito_directo
    requiere_comprobante: false
  - nombre: tarjeta_debito
    requiere_comprobante: false
  - nombre: tarjeta_credito
    requiere_comprobante: false
  - nombre: transferencia
    requiere_comprobante: true

concepto_cobro: # aclaración cliente respuesta 3 — confirmado, 10 conceptos iniciales
  - nombre: Cuota educativa
  - nombre: Matrícula
  - nombre: Servicio Nutricional
  - nombre: ESSERI Experience
  - nombre: ESSERI Conecta
  - nombre: Transporte
  - nombre: Penalidad por mora
  - nombre: Penalidad por stop debit
  - nombre: Daños y reparaciones
  - nombre: Extraordinario

motivo_justificacion: # aclaración cliente respuesta 10 — confirmado, 7 valores
  - nombre: enfermedad
  - nombre: certificado_medico
  - nombre: turno_estudio_medico
  - nombre: viaje_familiar
  - nombre: motivo_familiar_personal
  - nombre: actividad_autorizada_esseri
  - nombre: otro

regla_penalidad: # aclaración cliente respuesta 5 — confirmado, 3 tramos de mora
  # concepto_cobro se referencia por nombre acá; el script de carga debe resolverlo
  # al concepto_cobro_id real una vez insertado el catálogo de conceptos de cobro.
  - desde_dia_vencido: 0
    hasta_dia_vencido: 5
    porcentaje: 0
    concepto_cobro: Penalidad por mora # 0% — no genera MOVIMIENTO en la práctica, pero la FK no es nullable
  - desde_dia_vencido: 6
    hasta_dia_vencido: 15
    porcentaje: 20
    concepto_cobro: Penalidad por mora
  - desde_dia_vencido: 16
    hasta_dia_vencido: 30
    porcentaje: 30
    concepto_cobro: Penalidad por mora
